name : ci/cd pipeline

on :
     push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: set up docker
              uses: docker/setup-buildx-action@v4

            - uses: docker/build-push-action@v4
              with:
               username: ${{ secrets.DOCKERHUB_USERNAME }}
               password: ${{ secrets.DOCKERHUB_TOKEN }}


               
               
